<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1540" viewBox="0 0 1440 1540" role="img" aria-labelledby="title desc">
  <title id="title">Chainy numbered gameplay flow</title>
  <desc id="desc">Load a local profile, choose an unlocked short lesson in Web3, Blockchain or AI, complete its guided activities, answer a quiz, commit the result, and display a badge only after completion is saved. Incorrect activity results can be revised. Incomplete quiz results return to the quiz after saving. Staff export and interruption recovery are separate paths. M numbers refer to the GDD mechanics.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#465975"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#182b49} .h{font-weight:700;font-size:23px}.b{font-size:19px}.s{font-size:17px;fill:#435a78}.label{font-size:17px;font-weight:700;fill:#435a78}.line{fill:none;stroke:#465975;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.box{stroke:#b7c7dc;stroke-width:2;rx:18}
    </style>
  </defs>
  <rect width="1440" height="1540" fill="#f5f8fc"/>
  <rect x="0" y="0" width="1440" height="78" fill="#172c4a"/>
  <text x="42" y="37" style="fill:#fff;font:700 26px Arial,sans-serif">CHAINY • GAME FLOW</text>
  <text x="42" y="62" style="fill:#d7e7fa;font:17px Arial,sans-serif">M-01–M-12 link objects, properties and actions to the GDD mechanics register.</text>

  <rect class="box" x="400" y="105" width="640" height="92" fill="#e6f2ff"/>
  <text class="h" x="430" y="140">M-01 · Bootstrap &amp; learner profile</text>
  <text class="b" x="430" y="170">Validate content/database → select or confirm local code.</text>
  <path class="line" d="M720 197V237"/>
  <path class="line dash" d="M400 150H363"/>
  <rect class="box" x="50" y="110" width="310" height="96" fill="#fff0ed"/>
  <text class="h" x="72" y="142">Startup failure · M-12</text>
  <text class="s" x="72" y="171">Preserve records; explain recovery.</text>
  <text class="s" x="72" y="193">Do not start a broken session.</text>
  <rect class="box" x="400" y="237" width="640" height="96" fill="#e6f2ff"/>
  <text class="h" x="430" y="272">M-01 / M-02 · Main menu &amp; map</text>
  <text class="b" x="430" y="302">Continue / Play · three worlds · saved lesson progress.</text>
  <path class="line" d="M720 333V375"/>
  <rect class="box" x="400" y="375" width="640" height="96" fill="#e6f2ff"/>
  <text class="h" x="430" y="410">M-03 · Short example &amp; guide</text>
  <text class="b" x="430" y="440">Start lesson → read example → choose / inspect / act.</text>
  <path class="line" d="M720 471V495H240V530"/>
  <path class="line" d="M720 471V530"/>
  <path class="line" d="M720 471V495H1200V530"/>

  <rect class="box" x="60" y="530" width="360" height="210" fill="#e7f7ec"/>
  <text class="h" x="83" y="567">WEB3 · Everyday choices</text>
  <text class="b" x="83" y="607">M-03 · Read / select / sort</text>
  <text class="b" x="83" y="639">Apps, privacy and safe choices</text>
  <text class="s" x="83" y="681">State: scenario, response, feedback.</text>
  <text class="s" x="83" y="707">Fresh examples check understanding.</text>

  <rect class="box" x="540" y="530" width="360" height="210" fill="#e1f3fa"/>
  <text class="h" x="563" y="567">BLOCKCHAIN · Records</text>
  <text class="b" x="563" y="607">M-04/05 · Order / link records</text>
  <text class="b" x="563" y="639">M-06 · Inspect altered records</text>
  <text class="b" x="563" y="671">M-07 · Compare / repair 3 replicas</text>
  <text class="s" x="563" y="707">Trusted reference; explicit toy rule.</text>

  <rect class="box" x="1020" y="530" width="360" height="210" fill="#eee7ff"/>
  <text class="h" x="1043" y="567">AI · Examples &amp; actions</text>
  <text class="b" x="1043" y="607">M-08 · Label → train → test</text>
  <text class="b" x="1043" y="639">M-09 · Edit policy → run agent</text>
  <text class="s" x="1043" y="681">Properties: examples, model, trace.</text>
  <text class="s" x="1043" y="707">Predictions and actions stay distinct.</text>
  <path class="line" d="M240 740V780H720V825"/>
  <path class="line" d="M720 740V825"/>
  <path class="line" d="M1200 740V780H720V825"/>
  <rect class="box" x="470" y="825" width="500" height="82" fill="#fff3da"/>
  <text class="h" x="493" y="860">Rule feedback · relevant M-03–M-09</text>
  <text class="b" x="493" y="889">Inspect outcome → explain → revise and test.</text>
  <path class="line dash" d="M470 866H25V640H58"/>
  <text class="label" x="63" y="811">Retry the current activity</text>
  <text class="s" x="63" y="837">(any world; previous progress retained)</text>
  <path class="line" d="M720 907V959"/>
  <text class="label" x="738" y="938">required activity rules satisfied</text>

  <rect class="box" x="470" y="959" width="500" height="95" fill="#fff3da"/>
  <text class="h" x="493" y="995">M-10 · Fresh check &amp; explanation</text>
  <text class="b" x="493" y="1028">Submit result; distinguish first answer and retries.</text>
  <path class="line" d="M720 1054V1105"/>
  <rect class="box" x="470" y="1105" width="500" height="102" fill="#e6f2ff"/>
  <text class="h" x="493" y="1140">M-11 · Commit to local SQLite</text>
  <text class="b" x="493" y="1170">Attempt + checkpoint + earned progress together.</text>
  <text class="s" x="493" y="1194">Saving is a prerequisite for visible completion.</text>
  <path class="line" d="M970 1156H1010V1008H974"/>
  <text class="label" x="1030" y="1211">Committed, incomplete → quiz</text>
  <path class="line" d="M720 1207V1262"/>
  <text class="label" x="738" y="1238">committed and lesson complete</text>
  <rect class="box" x="470" y="1262" width="500" height="100" fill="#e7f7ec"/>
  <text class="h" x="493" y="1299">M-11 · Summary &amp; lesson badge</text>
  <text class="b" x="493" y="1330">Replay retains history; unlock follows saved rules.</text>
  <path class="line" d="M720 1362V1410"/>
  <rect class="box" x="470" y="1410" width="500" height="76" fill="#e6f2ff"/>
  <text class="h" x="493" y="1444">M-02 · Return to map / end session</text>
  <text class="s" x="493" y="1470">Next lesson / replay; journey ends after curriculum completes.</text>

  <rect class="box" x="50" y="988" width="315" height="154" fill="#ffffff"/>
  <text class="h" x="72" y="1022">Pause &amp; interruption</text>
  <text class="b" x="72" y="1053">M-01 / M-11</text>
  <text class="s" x="72" y="1084">Resume last committed checkpoint.</text>
  <text class="s" x="72" y="1110">Switch code closes the old session.</text>
  <path class="line dash" d="M450 471V964H205V985"/>

  <rect class="box" x="50" y="1235" width="315" height="124" fill="#fff0ed"/>
  <text class="h" x="72" y="1270">Save failure · M-11</text>
  <text class="s" x="72" y="1302">Keep pending result; retry same ID.</text>
  <text class="s" x="72" y="1329">No badge or silent database reset.</text>
  <path class="line dash" d="M470 1160H400V1298H368"/>
  <path class="line dash" d="M205 1235V1185H467"/>

  <rect class="box" x="1060" y="952" width="320" height="205" fill="#ffffff"/>
  <text class="h" x="1082" y="987">M-12 · Staff export</text>
  <text class="b" x="1082" y="1020">Choose scope → save file.</text>
  <text class="s" x="1082" y="1055">Transfer → validate/import → receipt.</text>
  <text class="s" x="1082" y="1084">Cancel/failure retains local records.</text>
  <text class="s" x="1082" y="1113">No gameplay internet requirement.</text>
  <text class="s" x="1082" y="1142">Re-import must not double-count.</text>
  <path class="line dash" d="M1040 284H1410V920H1220V949"/>
  <text class="s" x="1060" y="315">Staff entry from menu</text>
  <text class="s" x="42" y="1521">Design illustration • October 8, 2026 • Beta readiness and completion remain unverified.</text>
</svg>
